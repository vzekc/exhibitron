name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: geheim
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --recursive

      - name: Run GraphQL code generation
        run: |
          cd backend
          pnpm generate

      - name: Run tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: geheim
        run: pnpm test

      # The tests run through ts-node, which resolves imports against the
      # sources. What is deployed is the build, where the file names differ —
      # an import that only ts-node can follow takes the server down at
      # startup with every test still green. So the built server is started
      # here, against a database migrated from nothing, and has to answer.
      - name: Build
        run: pnpm build

      - name: Start the built server
        env:
          DATABASE_URL: postgres://postgres:geheim@localhost:5432/testdb
          SESSION_SECRET: only-for-this-run-and-long-enough-for-fastify
          NODE_ENV: production
        run: |
          cd backend
          npx mikro-orm-esm migration:up
          node dist/server.js &
          server=$!
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" != "000" ]; then
              echo "the built server answered after ${attempt} tries"
              kill $server
              exit 0
            fi
            if ! kill -0 $server 2>/dev/null; then
              echo "::error::the built server died during startup"
              exit 1
            fi
            sleep 2
          done
          echo "::error::the built server did not answer within a minute"
          kill $server 2>/dev/null
          exit 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOYMENT_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOYMENT_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          git push -f hans@${{ secrets.DEPLOYMENT_HOST }}:exhibitron HEAD:deploy 2>&1 || {
            echo "::error::Git push failed. Check the server-side post-receive hook for errors."
            echo "Fetching server deployment log..."
            ssh hans@${{ secrets.DEPLOYMENT_HOST }} 'tail -50 exhibitron/deploy.log 2>/dev/null || echo "No deploy log found"'
            exit 1
          }
