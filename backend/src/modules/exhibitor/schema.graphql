type Exhibitor {
  id: Int!
  user: User!
  topic: String
  exhibits: [Exhibit!]
  tables: [Table!]
  canSwitchExhibitor: Boolean!
  showsVisitorPhotos: Boolean!
}

extend type Mutation {
  updateExhibitor(id: Int!, topic: String, showsVisitorPhotos: Boolean): Exhibitor
  switchExhibitor(exhibitorId: Int!): Exhibitor
}

extend type Query {
  getCurrentExhibitor: Exhibitor
  getExhibitor(id: Int!): Exhibitor
}
