scalar Date

type VolunteerActivity {
  id: Int!
  key: String!
  name: String!
  summary: String!
  description: String
  contact: Exhibitor
  periods: [VolunteerPeriod!]!
}

type VolunteerPeriod {
  id: Int!
  activity: VolunteerActivity!
  startTime: Date!
  endTime: Date!
  durationMinutes: Int!
  """
  How many people are wanted at any moment. Null means as many as register.
  """
  neededCount: Int
  coverage: [VolunteerCoverageSpan!]!
  bookings: [VolunteerBooking!]!
}

"""
One stretch of a period through which the same people are helping.
"""
type VolunteerCoverageSpan {
  startTime: Date!
  endTime: Date!
  count: Int!
  unconfirmed: Int!
  needed: Int
  status: CoverageStatus!
}

enum CoverageStatus {
  none
  under
  met
  over
  unlimited
}

type VolunteerBooking {
  id: Int!
  period: VolunteerPeriod!
  startTime: Date!
  endTime: Date!
  durationMinutes: Int!
  """
  Who is helping, for a caller who is logged in. Null for everybody else.
  """
  name: String
  confirmed: Boolean!
  isMine: Boolean!
}

extend type Query {
  getVolunteerActivities: [VolunteerActivity!]!
  getVolunteerActivity(key: String!): VolunteerActivity
  getMyVolunteerBookings: [VolunteerBooking!]!
}

input CreateVolunteerActivityInput {
  key: String!
  name: String!
  summary: String!
  description: String
  contactId: Int
  ordering: Int
}

input UpdateVolunteerActivityInput {
  key: String
  name: String
  summary: String
  description: String
  contactId: Int
  ordering: Int
}

input CreateVolunteerPeriodInput {
  activityId: Int!
  startTime: Date!
  durationMinutes: Int!
  neededCount: Int
}

input UpdateVolunteerPeriodInput {
  startTime: Date
  durationMinutes: Int
  neededCount: Int
}

input BookVolunteerSlotInput {
  periodId: Int!
  startTime: Date!
  durationMinutes: Int!
}

input RegisterVolunteerInput {
  name: String!
  email: String!
  password: String!
}

enum RegisterVolunteerOutcome {
  verificationSent
  useForumLogin
  useLogin
}

"""
What somebody who is not logged in should do next.
"""
type RegisterVolunteerResult {
  outcome: RegisterVolunteerOutcome!
  message: String!
}

extend type Mutation {
  bookVolunteerSlot(input: BookVolunteerSlotInput!): VolunteerBooking!
  registerVolunteer(input: RegisterVolunteerInput!): RegisterVolunteerResult!
  """
  Confirms the address behind the token and opens the session. True when this
  was the first time — a link used again says false, and the site takes the
  volunteer straight to the plan.
  """
  confirmVolunteerEmail(token: String!): Boolean!
  cancelVolunteerBooking(id: Int!): Boolean!
  """
  Removes the account of whoever is signed in, with every shift they had
  taken on. The people responsible for those activities are told.
  """
  deleteMyVolunteerAccount: Boolean!
  createVolunteerActivity(input: CreateVolunteerActivityInput!): VolunteerActivity!
  updateVolunteerActivity(id: Int!, input: UpdateVolunteerActivityInput!): VolunteerActivity!
  deleteVolunteerActivity(id: Int!): Boolean!
  createVolunteerPeriod(input: CreateVolunteerPeriodInput!): VolunteerPeriod!
  updateVolunteerPeriod(id: Int!, input: UpdateVolunteerPeriodInput!): VolunteerPeriod!
  deleteVolunteerPeriod(id: Int!): Boolean!
}
