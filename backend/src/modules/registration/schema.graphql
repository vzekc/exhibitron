scalar JSON
scalar Date

type Registration {
  createdAt: Date!
  updatedAt: Date
  email: String!
  id: Int!
  message: String
  name: String!
  nickname: String
  notes: String
  status: RegistrationStatus!
  topic: String!
  data: JSON
  isLoggedIn: Boolean!
  tables: [Table!]!
  processedTopic: String!
  nextTo: String
  hasNotes: Boolean!
  talkTitle: String
  talkSummary: String
  exhibitorId: Int
  """
  What the survey questions on the form were answered with, in the order the
  questions are asked.
  """
  surveyAnswers: [RegistrationSurveyAnswer!]!
}

type RegistrationSurveyAnswer {
  question: SurveyQuestion!
  value: JSON!
}

input RegisterInput {
  email: String!
  message: String
  name: String!
  nickname: String!
  topic: String!
  data: JSON!
  surveyAnswers: [SurveyAnswerInput!]
}

extend type Mutation {
  register(input: RegisterInput!): Registration
  setRegistrationInProgress(id: Int!): Boolean
  updateRegistrationNotes(id: Int!, notes: String!): Registration
  approveRegistration(id: Int!, siteUrl: String!, message: String): Boolean
  rejectRegistration(id: Int!): Boolean
  deleteRegistration(id: Int!): Boolean
}

extend type Query {
  getRegistration(id: Int!): Registration
  getRegistrations: [Registration!]
  isRegistered(email: String!): Boolean
}

enum RegistrationStatus {
  approved
  inProgress
  new
  rejected
}
